[project]
name = "astral"
version = "0.1.0"
description = "ASTRAL — Advanced Space Traffic Risk Assessment & Analysis Laboratory"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: long-running benchmark or training tests"]
filterwarnings = ["ignore::erfa.ErfaWarning"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S311", "B008", "UP040"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E731"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
